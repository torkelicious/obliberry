# cross platform builds
#
# ubuntu gcc
# msvc
# macos clang

name: Cross-platform build

on:
    workflow_dispatch:

jobs:
    build:
        name: Build (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   name: linux
                        os: ubuntu-latest
                        configure_preset: linux-release
                        build_preset: linux-release
                    -   name: windows
                        os: windows-latest
                        configure_preset: windows-default
                        build_preset: windows-release
                    -   name: macos
                        os: macos-latest
                        configure_preset: macos-release
                        build_preset: macos-release

        steps:
            -   name: Checkout (with submodules)
                uses: actions/checkout@v4
                with:
                    submodules: recursive

            # GLFW builds both its Wayland and X11 backends on Linux.
            # needs the Wayland scanner and X11 dev headers.
            -   name: Install Linux dependencies (GLFW)
                if: runner.os == 'Linux'
                run: |
                    sudo apt-get update
                    sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

            # Cache deps
            -   name: Cache fetched dependencies
                uses: actions/cache@v4
                with:
                    path: .deps
                    key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

            -   name: Configure
                run: cmake --preset ${{ matrix.configure_preset }}

            -   name: Build (all targets)
                run: cmake --build --preset ${{ matrix.build_preset }}

            -   name: Upload binaries
                uses: actions/upload-artifact@v4
                with:
                    name: obliberry-${{ matrix.name }}
                    path: build/${{ matrix.configure_preset }}/bin
                    if-no-files-found: error
                    retention-days: 7
