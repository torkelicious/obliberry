# cross platform builds
#
# ubuntu gcc
# msvc
# macos clang


name: Cross-platform build

on:
    workflow_dispatch:

permissions:
    contents: read
    actions: read

jobs:
    build:
        name: Build (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   name: linux
                        os: ubuntu-latest
                        configure_preset: linux-release
                        build_preset: linux-release
                    -   name: windows
                        os: windows-latest
                        configure_preset: windows-default-2026
                        build_preset: windows-release-2026
                    -   name: macos
                        os: macos-latest
                        configure_preset: macos-release
                        build_preset: macos-release

        steps:
            -   name: Checkout (with submodules)
                uses: actions/checkout@v7
                with:
                    submodules: recursive

            # deps for the deps :)
            -   name: Install Linux dependencies (GLFW, nativefiledialog-extended)
                if: runner.os == 'Linux'
                run: |
                    sudo apt-get update
                    sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgtk-3-dev libdbus-1-dev

            # cache deps
            -   name: Cache fetched dependencies
                uses: actions/cache@v6
                with:
                    path: .deps
                    key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

            -   name: Configure
                run: cmake --preset ${{ matrix.configure_preset }}

            -   name: Build (all targets)
                run: cmake --build --preset ${{ matrix.build_preset }}

            -   name: Upload binaries
                uses: actions/upload-artifact@v7
                with:
                    name: obliberry-${{ matrix.name }}
                    path: build/${{ matrix.configure_preset }}/bin
                    if-no-files-found: error
                    retention-days: 7
