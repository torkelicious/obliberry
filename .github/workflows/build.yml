# cross platform builds
#
# ubuntu gcc
# msvc
# macos clang


name: Cross-platform build / release

on:
    workflow_dispatch:
        inputs:
            publish_release:
                description: 'Publish a GitHub release from these builds'
                required: false
                default: false
                type: boolean
            release_tag:
                description: 'Tag for the release (only when publish_release is checked)'
                required: false
                default: v0.0.0
                type: string
    push:
        tags:
            - 'v*'

permissions:
    contents: read
    actions: read

jobs:
    build:
        name: Build (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   name: linux
                        os: ubuntu-latest
                        arch: x86_64
                        configure_preset: linux-release
                        build_preset: linux-release
                    -   name: windows
                        os: windows-latest
                        arch: x86_64
                        configure_preset: windows-default-2026
                        build_preset: windows-release-2026
                    -   name: macos
                        os: macos-latest
                        arch: arm64
                        configure_preset: macos-release
                        build_preset: macos-release

        steps:
            -   name: Checkout (with submodules)
                uses: actions/checkout@v7
                with:
                    submodules: recursive

            # deps for the deps :)
            -   name: Install Linux dependencies (GLFW, nativefiledialog-extended)
                if: runner.os == 'Linux'
                run: |
                    sudo apt-get update
                    sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgtk-3-dev libdbus-1-dev

            # cache deps
            -   name: Cache fetched dependencies
                uses: actions/cache@v6
                with:
                    path: .deps
                    key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

            -   name: Configure
                run: cmake --preset ${{ matrix.configure_preset }}

            -   name: Build (all targets)
                run: cmake --build --preset ${{ matrix.build_preset }}

            -   name: Upload binaries
                uses: actions/upload-artifact@v7
                with:
                    name: obliberry-${{ matrix.name }}-${{ matrix.arch }}
                    path: build/${{ matrix.configure_preset }}/bin
                    if-no-files-found: error
                    retention-days: 7

    # github releases
    release:
        name: Publish release
        needs: build
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   name: Download platform builds
                uses: actions/download-artifact@v7
                with:
                    path: artifacts

            -   name: Install zip
                run: sudo apt-get install -y zip

            # artifact folder to (obliberry-<os>-<arch>).zip
            -   name: Package zips and checksums
                run: |
                    cd artifacts
                    for dir in obliberry-*/; do
                        zip -r "../${dir%/}.zip" "$dir"
                    done
                    cd ..
                    sha256sum obliberry-*.zip > SHA256SUMS

            -   name: Create release
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_tag }}
                    files: |
                        obliberry-*.zip
                        SHA256SUMS
                    generate_release_notes: true
