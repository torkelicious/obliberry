# cross platform builds
#
# ubuntu gcc
# msvc
# macos clang

name: Cross-platform build / release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub release from these builds'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Tag for the release (only when publish_release is checked)'
        required: false
        default: v0.0.0
        type: string
      custom_release_text:
        description: 'Additional text for release notes'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-store
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            arch: x86_64
            configure_preset: linux-release
            build_preset: linux-release

          - name: windows
            os: windows-latest
            arch: x86_64
            configure_preset: windows-ninja-release
            build_preset: windows-ninja-release

          - name: macos
            os: macos-latest
            arch: arm64
            configure_preset: macos-release
            build_preset: macos-release

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgtk-3-dev libdbus-1-dev

      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
          export-path-to-vcvarsall: true

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: .deps
          key: build-deps-${{ runner.os }}-${{ runner.arch }}-${{ matrix.configure_preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**') }}

      - name: Cache sccache storage
        uses: actions/cache@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: build-sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.configure_preset }}-${{ github.sha }}
          restore-keys: |
            build-sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.configure_preset }}-

      - name: Install sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        run: >-
          cmake --preset ${{ matrix.configure_preset }}
          -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.deps"
          -DBUILD_TESTING=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build all targets
        run: cmake --build --preset ${{ matrix.build_preset }} --parallel

      - name: sccache stats
        if: always() && steps.sccache.outcome == 'success'
        run: sccache --show-stats

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: obliberry-${{ matrix.name }}-${{ matrix.arch }}
          path: build/${{ matrix.configure_preset }}/bin
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout for license files
        uses: actions/checkout@v7

      - name: Download platform builds
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Package zips and checksums
        run: |
          cd artifacts
          for dir in obliberry-*/; do
              cp ../LICENSE ../docs/THIRD_PARTY_LICENSES.md "$dir"
              zip -r "../${dir%/}.zip" "$dir"
          done
          cd ..
          sha256sum obliberry-*.zip > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            obliberry-*.zip
            SHA256SUMS
          generate_release_notes: true
          body: |

            Unzip the downloaded archive and run `obliberry_editor` for your platform.
            > **Note for Linux / macOS:** You may need to run `chmod +x obliberry_editor` in your terminal to make the application executable.

            ${{ github.event.inputs.custom_release_text }}
