name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-debug
            rendering: 'ON'
          - os: windows-latest
            preset: windows-ninja-debug
            rendering: 'OFF'
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgtk-3-dev libdbus-1-dev libgl1-mesa-dev xvfb xauth

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure tests
        run: cmake --preset ${{ matrix.preset }} -DBUILD_TESTING=ON -DBUILD_PACK_TOOLS=OFF -DOBLIBERRY_TEST_RENDERING=${{ matrix.rendering }}

      - name: Build tests
        run: cmake --build --preset ${{ matrix.preset }} --target obliberry_tests --parallel 2

      - name: Run Linux tests with software rendering
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          OBLIBERRY_REQUIRE_RENDERING_TESTS: '1'
        run: xvfb-run -a ctest --test-dir build/${{ matrix.preset }} --output-on-failure --no-tests=error

      - name: Run Windows tests
        if: runner.os == 'Windows'
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --no-tests=error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
