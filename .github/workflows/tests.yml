name: Tests

on:
    push:
        branches: [ main, master ]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Tests (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        env:
            SCCACHE_DIR: ${{ github.workspace }}/.sccache-store
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: ubuntu-latest
                        preset: linux-debug
                        rendering: "ON"
                        configure_args: ""

                    -   os: windows-latest
                        preset: windows-ninja-debug
                        rendering: "OFF"
                        configure_args: >-
                            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
                            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

                    -   os: macos-latest
                        preset: macos-debug
                        rendering: "OFF"
                        configure_args: ""

        steps:
            -   name: Checkout with submodules
                uses: actions/checkout@v7
                with:
                    submodules: recursive

            -   name: Install Linux dependencies
                if: runner.os == 'Linux'
                run: |
                    sudo apt-get update
                    sudo apt-get install -y ninja-build libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgtk-3-dev libdbus-1-dev libgl1-mesa-dev xvfb xauth

            -   name: Set up MSVC
                if: runner.os == 'Windows'
                uses: TheMrMilchmann/setup-msvc-dev@v4
                with:
                    arch: x64

            -   name: Cache fetched dependencies
                uses: actions/cache@v6
                with:
                    path: .deps
                    key: test-deps-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'tests/CMakeLists.txt') }}

            -   name: Cache sccache storage
                uses: actions/cache@v6
                with:
                    path: ${{ env.SCCACHE_DIR }}
                    key: test-sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-${{ github.sha }}
                    restore-keys: |
                        test-sccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.preset }}-

            -   name: Install sccache
                id: sccache
                uses: mozilla-actions/sccache-action@v0.0.11

            -   name: Configure tests
                run: >-
                    cmake --preset ${{ matrix.preset }}
                    -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.deps"
                    -DCMAKE_C_COMPILER_LAUNCHER=sccache
                    -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
                    -DBUILD_TESTING=ON
                    -DBUILD_PACK_TOOLS=OFF
                    -DOBLIBERRY_TEST_RENDERING=${{ matrix.rendering }}
                    ${{ matrix.configure_args }}

            -   name: Build tests
                run: cmake --build --preset ${{ matrix.preset }} --target obliberry_tests --parallel 2

            -   name: Run Linux tests with software rendering
                if: runner.os == 'Linux'
                env:
                    LIBGL_ALWAYS_SOFTWARE: "1"
                    OBLIBERRY_REQUIRE_RENDERING_TESTS: "1"
                run: xvfb-run -a ctest --test-dir build/${{ matrix.preset }} --output-on-failure --no-tests=error

            -   name: Run Windows and macOS tests
                if: runner.os != 'Linux'
                run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --no-tests=error

            -   name: sccache stats
                if: always() && steps.sccache.outcome == 'success'
                run: sccache --show-stats

            -   name: Upload test results
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: test-results-${{ matrix.os }}
                    path: build/${{ matrix.preset }}/Testing/Temporary/
                    if-no-files-found: ignore
                    retention-days: 7
